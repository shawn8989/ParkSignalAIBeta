name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import sys, json; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for rt in d for x in d[rt] if x.get('isAvailable') and 'iPhone' in x.get('name','')]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo 'No iPhone simulator available' >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Build & test (unit tests)
        env:
          # xcodebuild forwards TEST_RUNNER_* (prefix stripped) to the test process.
          TEST_RUNNER_CORPUS_REPORT_PATH: ${{ runner.temp }}/corpus-report.txt
        run: |
          set -o pipefail
          xcodebuild test \
            -project test2.xcodeproj \
            -scheme test2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -only-testing:test2Tests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult
        # Note: the UI-test target (test2UITests) is Xcode boilerplate and is
        # excluded here — it hangs on GitHub runners (instruments lockdown
        # timeout). Unit tests cover the real logic.

      - name: Parser corpus report
        if: always()
        run: |
          REPORT="${{ runner.temp }}/corpus-report.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
            {
              echo "### Parser corpus"
              grep 'CORPUS|SUMMARY' "$REPORT" | cut -d'|' -f3
              echo
              echo '<details><summary>Per-sign results</summary>'
              echo
              echo '```'
              cat "$REPORT"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No corpus report was written."
          fi

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
